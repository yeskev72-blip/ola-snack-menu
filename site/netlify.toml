# Déploiement Netlify du site vitrine (dossier « site » à la racine du dépôt).

[build]
  publish = "."

# L'APK est servi par Netlify, et non par les releases GitHub : le dépôt peut rester privé
# sans que le téléchargement cesse de fonctionner. Le fichier est remplacé à chaque build
# par le workflow « Construire l'APK ».
[[redirects]]
  from = "/apk"
  to = "/calbasse.apk"
  status = 302
  force = true

# Sans ce type, certains navigateurs affichent le fichier au lieu de le télécharger.
[[headers]]
  for = "/calbasse.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"calbasse.apk\""
