<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Jakarta'; src: url('jakarta-800.ttf') format('truetype'); font-weight: 800; }
  @font-face { font-family: 'Jakarta'; src: url('jakarta-500.ttf') format('truetype'); font-weight: 500; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: var(--fond, #FBF8F3);
    font-family: 'Jakarta', system-ui, sans-serif;
    color: var(--texte, #1B1511);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0;
  }
  /* Anneau pointillé et disque, comme l'écran d'accueil de l'app. */
  .art { position: relative; width: 620px; height: 620px; display: grid; place-items: center; }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 4px dashed var(--anneau, #E1CFB6);
    animation: tourne 9s linear infinite, apparait .5s ease-out both;
  }
  .disc {
    position: absolute; inset: 88px; border-radius: 50%; background: var(--disque, #F6E6D3);
    animation: gonfle .7s cubic-bezier(.2,.9,.3,1.2) both .05s;
  }
  svg.logo { position: relative; width: 340px; height: 340px; animation: gonfle .75s cubic-bezier(.2,.9,.3,1.3) both .18s; }

  .nom {
    margin-top: 86px;
    font-weight: 800; font-size: 132px; letter-spacing: 14px;
    color: var(--marque, #9C4A1E); text-transform: uppercase;
    animation: monte .6s cubic-bezier(.2,.8,.3,1) both .5s;
  }
  .phrase {
    margin-top: 26px; font-weight: 500; font-size: 46px; line-height: 1.35;
    text-align: center; max-width: 820px; color: var(--doux, #685A4D);
    animation: monte .6s cubic-bezier(.2,.8,.3,1) both .66s;
  }
  .bio {
    margin-top: 96px;
    font-weight: 800; font-size: 50px; letter-spacing: 1px;
    padding: 34px 64px; border-radius: 999px;
    background: var(--pilule, #1B1511); color: var(--pilule-texte, #FBF8F3);
    animation: monte .6s cubic-bezier(.2,.8,.3,1.2) both .92s;
  }

  @keyframes gonfle { from { transform: scale(.72); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  @keyframes monte  { from { transform: translateY(42px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes apparait { from { opacity: 0 } to { opacity: 1 } }
  @keyframes tourne { to { transform: rotate(360deg) } }

  body.sombre {
    --fond: #1B1511; --texte: #FBF8F3; --doux: #C4B5A6;
    --marque: #E0894F; --anneau: #4A3A2C; --disque: #2E241C;
    --pilule: #FBF8F3; --pilule-texte: #1B1511;
  }
</style>
</head>
<body>
<script>if (location.hash === '#sombre') document.addEventListener('DOMContentLoaded', () => document.body.classList.add('sombre'));</script>
  <div class="art">
    <div class="ring"></div>
    <div class="disc"></div>
    <svg class="logo" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="#9C4A1E" />
      <circle cx="50" cy="50" r="38" fill="#D9A55B" />
      <circle cx="50" cy="50" r="31" fill="#F3D9A4" />
      <ellipse cx="39" cy="38" rx="10" ry="6" fill="#FFF6E3" opacity=".8" transform="rotate(-35 39 38)" />
    </svg>
  </div>
  <div class="nom">Calbasse</div>
  <div class="phrase">Ton plat en photo,<br />les calories tout de suite.</div>
  <div class="bio">Lien en bio</div>
</body>
</html>
