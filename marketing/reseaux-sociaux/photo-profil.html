<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fff}
  .card{width:1080px;height:1080px;position:relative;overflow:hidden;
        display:flex;align-items:center;justify-content:center;
        font-family:'Plus Jakarta Sans',sans-serif}
  /* --- calebasse --- */
  .gourd{position:relative;border-radius:50%}
  .ring2,.ring3,.gloss{position:absolute;border-radius:50%}
  .ring2{inset:9%}.ring3{inset:19%}
  .gloss{width:19%;height:12%;left:22%;top:27%;background:#FFF6E3;
         transform:rotate(-32deg);opacity:.92}
  /* A : fond crème, calebasse pleine */
  #a .card{background:#FBF8F3}
  #a .gourd{width:860px;height:860px;background:#C9551F}
  #a .ring2{background:#D9A55B}#a .ring3{background:#F3D9A4}
  /* B : fond terracotta, calebasse claire */
  #b .card{background:#C9551F}
  #b .gourd{width:820px;height:820px;background:#FBF8F3}
  #b .ring2{background:#D9A55B}#b .ring3{background:#F3D9A4}
  /* C : fond terracotta + nom */
  #c .card{background:#C9551F;flex-direction:column;gap:44px}
  #c .gourd{width:520px;height:520px;background:#FBF8F3}
  #c .ring2{background:#D9A55B}#c .ring3{background:#F3D9A4}
  #c .name{font-weight:800;font-size:112px;letter-spacing:-.02em;color:#FBF8F3;line-height:1}
</style></head><body>
<div id="a"><div class="card"><div class="gourd"><div class="ring2"></div><div class="ring3"></div><div class="gloss"></div></div></div></div>
<div id="b"><div class="card"><div class="gourd"><div class="ring2"></div><div class="ring3"></div><div class="gloss"></div></div></div></div>
<div id="c"><div class="card"><div class="gourd"><div class="ring2"></div><div class="ring3"></div><div class="gloss"></div></div><div class="name">Calbasse</div></div></div>
</body></html>
