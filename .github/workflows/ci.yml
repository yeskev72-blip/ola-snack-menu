# Vérifications à chaque push et pull request : app, Edge Functions, base de données.
name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: App (TypeScript, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Table des plats cohérente et seed.sql à jour
        run: node scripts/seed-foods.mjs --check
      - name: Aucun secret dans le bundle de l'app
        run: bash scripts/check-bundle-secrets.sh

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-config supabase/functions/analyze-meal/index.ts supabase/functions/delete-account/index.ts
      - run: deno lint --no-config supabase/functions
      - run: deno test --no-config supabase/functions

  database:
    name: Base (migrations, RLS, quota)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-db.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
