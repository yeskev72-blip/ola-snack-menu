# Lance un build EAS de l'APK Android depuis GitHub, sans terminal.
# GitHub > onglet Actions > « Construire l'APK » > Run workflow.
# Prérequis : secret de dépôt EXPO_TOKEN (jeton d'accès expo.dev) ; variables
# EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY déclarées sur expo.dev.
# À la fin, l'APK est publié à deux endroits :
#   - sur le site (site/calbasse.apk, servi par Netlify) : c'est le lien public de téléchargement,
#     qui continue de fonctionner même si ce dépôt est privé ;
#   - dans GitHub > Releases, comme archive des versions successives.
name: Construire l'APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profil EAS (preview = APK de test, production = APK à diffuser)
        type: choice
        options:
          - preview
          - production
        default: preview
      build_id:
        description: Facultatif — identifiant d'un build Expo déjà terminé à publier sans reconstruire
        type: string
        required: false
        default: ''

concurrency:
  group: build-apk
  cancel-in-progress: false

# Publication de l'APK dans les Releases du dépôt.
permissions:
  contents: write

jobs:
  build:
    name: Build EAS Android (${{ inputs.profile }})
    runs-on: ubuntu-latest
    # Le build Expo dure 15 à 30 minutes ; marge pour la file d'attente.
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Vérifier le secret EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN manquant : GitHub > Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Aussi nécessaire pour publier un build existant : eas-cli lit app.config.ts.
      - run: npm ci

      - name: Lancer le build sur les serveurs Expo
        id: build
        env:
          # Passé par une variable (et vérifié) plutôt qu'inséré dans le script.
          EXISTING_BUILD_ID: ${{ inputs.build_id }}
        run: |
          if [ -n "$EXISTING_BUILD_ID" ]; then
            if ! [[ "$EXISTING_BUILD_ID" =~ ^[0-9a-f-]{36}$ ]]; then
              echo "::error::build_id invalide (attendu : identifiant Expo du type 748a430c-49b8-…)"; exit 1
            fi
            BUILD_ID="$EXISTING_BUILD_ID"
            echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"
            echo "url=https://expo.dev/accounts/dessoyess-team/projects/calbasse/builds/$BUILD_ID" >> "$GITHUB_OUTPUT"
            echo "Publication du build existant $BUILD_ID (pas de nouveau build)."
            exit 0
          fi
          npx --yes eas-cli@latest build --platform android --profile "${{ inputs.profile }}" \
            --non-interactive --no-wait --json > build.json
          cat build.json
          BUILD_ID=$(jq -r '.[0].id' build.json)
          URL="https://expo.dev/accounts/dessoyess-team/projects/calbasse/builds/$BUILD_ID"
          echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "## Build lancé ✅"
            echo
            echo "Suivi sur Expo : $URL"
            echo "L'APK sera publié dans les Releases du dépôt à la fin du build (15 à 30 minutes)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attendre la fin du build Expo
        id: wait
        run: |
          FAILS=0
          for i in $(seq 1 160); do
            if npx --yes eas-cli@latest build:view "${{ steps.build.outputs.id }}" --json > view.json 2> view.err; then
              FAILS=0
              STATUS=$(jq -r '.status // "UNKNOWN"' view.json 2>/dev/null || echo UNKNOWN)
            else
              FAILS=$((FAILS + 1))
              STATUS=UNKNOWN
              cat view.err
              # Cinq échecs de suite : inutile d'attendre 80 minutes.
              if [ "$FAILS" -ge 5 ]; then echo "::error::Lecture du build Expo impossible"; exit 1; fi
            fi
            echo "Statut : $STATUS"
            case "$STATUS" in
              FINISHED)
                APK_URL=$(jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty' view.json)
                if [ -z "$APK_URL" ]; then echo "::error::Build terminé sans lien vers l'APK"; exit 1; fi
                echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              ERRORED|CANCELED)
                echo "::error::Le build Expo a échoué ($STATUS) : ${{ steps.build.outputs.url }}"
                exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::Build toujours en cours après 80 minutes : ${{ steps.build.outputs.url }}"
          exit 1

      - name: Publier l'APK dans les Releases GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL "${{ steps.wait.outputs.apk_url }}" -o calbasse.apk
          SHORT=$(git rev-parse --short HEAD)
          TAG="apk-${{ github.run_number }}-${{ inputs.profile }}"
          gh release create "$TAG" calbasse.apk \
            --target "$GITHUB_SHA" \
            --title "Calbasse APK n°${{ github.run_number }} (${{ inputs.profile }}, $SHORT)" \
            --notes "APK construit depuis le commit $SHORT. Télécharge **calbasse.apk** ci-dessous, puis ouvre-le sur le téléphone. Build Expo : ${{ steps.build.outputs.url }}" \
            --latest
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Le téléchargement public passe par le site, pas par les Releases : le dépôt peut donc
      # être privé sans couper la distribution. Netlify republie dès que main change.
      - name: Publier l'APK sur le site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B publication-apk origin/main
          cp calbasse.apk site/calbasse.apk
          git add site/calbasse.apk
          if git diff --cached --quiet; then
            echo "APK identique à celui déjà en ligne : rien à publier."
          else
            git commit -m "APK n°${{ github.run_number }} en téléchargement sur le site"
            git push origin HEAD:main
          fi
          {
            echo
            echo "## APK prêt ✅"
            echo
            echo "Téléchargement public : https://calbasse.netlify.app/apk"
            echo
            echo "Le site se republie tout seul ; compte une minute avant que le nouveau fichier soit servi."
            echo "Archive de cette version : Releases > apk-${{ github.run_number }}-${{ inputs.profile }}"
          } >> "$GITHUB_STEP_SUMMARY"
