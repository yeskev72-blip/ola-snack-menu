name: Publier une mise à jour à distance

# Envoie le code JavaScript courant aux téléphones déjà équipés : la correction s'installe
# au lancement suivant, sans nouvel APK. Ne couvre pas les changements natifs (module,
# permission, icône) : ceux-là demandent « Construire l'APK ».
#
# Le canal sert aussi de nom d'environnement EAS (--environment) : c'est ce qui injecte
# EXPO_PUBLIC_SUPABASE_URL et EXPO_PUBLIC_SUPABASE_ANON_KEY, déclarées sur expo.dev, dans
# le bundle. Sans cette option, la mise à jour part sans configuration et l'app ne démarre plus.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal (preview = APK partagés aujourd’hui)'
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: 'Ce que corrige cette mise à jour (visible dans le tableau de bord Expo)'
        type: string
        required: true

jobs:
  update:
    name: Mise à jour ${{ inputs.channel }}
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le secret EXPO_TOKEN
        run: '[ -n "$EXPO_TOKEN" ] || { echo "::error::Secret EXPO_TOKEN absent"; exit 1; }'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Garde-fou : une mise à jour à distance ne doit jamais partir avec du code qui ne compile pas,
      # puisqu'elle s'installe sans que personne ne la valide sur le téléphone.
      - run: npx tsc --noEmit
      - run: npm test

      # Les EXPO_PUBLIC_* sont figées dans le bundle au moment de sa construction. Si elles
      # manquent, la mise à jour part sans l'URL Supabase et l'app affiche « Configuration
      # manquante » sur tous les téléphones. C'est arrivé le 30/09/2026. On construit donc le
      # bundle à part, avec les variables de l'environnement EAS, pour pouvoir l'inspecter
      # avant de le publier.
      - name: Construire le bundle avec la configuration de ${{ inputs.channel }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@latest env:exec "${{ inputs.channel }}" \
            'npx expo export --platform android --output-dir dist' --non-interactive

      # Le contrôle porte sur le bundle réellement publié, pas sur la présence des variables :
      # c'est la seule preuve que la configuration a bien été injectée. Seul le domaine est
      # cherché, jamais une valeur de clé, pour ne rien exposer dans les journaux.
      - name: Vérifier que la configuration est dans le bundle
        run: |
          if grep -rq 'supabase\.co' dist/; then
            echo "Configuration Supabase présente dans le bundle."
          else
            echo "::error::Le bundle ne contient pas l'URL Supabase : publier maintenant afficherait « Configuration manquante » sur tous les téléphones. Vérifier EXPO_PUBLIC_SUPABASE_URL et EXPO_PUBLIC_SUPABASE_ANON_KEY dans l'environnement « ${{ inputs.channel }} » sur expo.dev."
            exit 1
          fi

      - name: Publier sur le canal ${{ inputs.channel }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@latest update \
            --channel "${{ inputs.channel }}" \
            --environment "${{ inputs.channel }}" \
            --message "${{ inputs.message }}" \
            --skip-bundler --input-dir dist \
            --non-interactive --json > update.json
          cat update.json
          {
            echo "## Mise à jour publiée ✅"
            echo
            echo "Canal : **${{ inputs.channel }}**"
            echo
            echo "Les téléphones dont l'APK a la même empreinte l'installeront au prochain lancement."
            echo "Un APK plus ancien, construit avant un changement natif, ne la reçoit pas : il faut alors le réinstaller."
          } >> "$GITHUB_STEP_SUMMARY"
